[package]
name = "sslocal-ffi"
version = "0.1.0"
edition = "2021"
publish = false
description = "C ABI wrapper around shadowsocks-service for the HarmonyOS NEXT app"
license = "GPL-3.0-or-later"

[lib]
name = "sslocal_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# local-tun is on by default: HarmonyOS routes all packets through a tun
# device handed to the core as a file descriptor. local-flow-stat is on by
# default too: the app reads cumulative traffic counters like
# shadowsocks-android does.
default = ["local-tun", "local-flow-stat"]
# Direct tun-device support (requires the `tun` crate to build for the target)
local-tun = ["shadowsocks-service/local-tun"]
# Periodic flow-stat reporting (tx/rx counters to a loopback TCP address)
local-flow-stat = ["shadowsocks-service/local-flow-stat"]
# Host-only diagnostic binary, never part of the HarmonyOS build. Gated behind a
# feature because it must be buildable without the dev-dependencies (which the
# cross build does not fetch) and because it has no business being compiled for
# aarch64-unknown-linux-ohos.
socks-probe = []

[[bin]]
name = "socks_probe"
path = "src/bin/socks_probe.rs"
required-features = ["socks-probe"]

[dev-dependencies]
env_logger = "0.11"

[dependencies]
log = "0.4"
serde_json = "1"
base64 = "0.22"
rand = "0.9"
futures = "0.3"
# TLS + WebSocket transport layers for the built-in v2ray-plugin SIP003
# client (meow-rs, GPL-compatible; leaf crate — rustls + tokio-tungstenite +
# webpki-roots, no other meow-* dependencies).
meow-transport = { git = "https://github.com/madeye/meow-rs", tag = "v0.18.0" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
shadowsocks-service = { path = "../../../core/src/main/rust/shadowsocks-rust/crates/shadowsocks-service", default-features = false, features = [
    "local",
    "server",
    "aead-cipher",
    "aead-cipher-2022",
    "local-dns",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "time",
] }

[workspace]

# The published `tun` crate cannot drive a tun device on OpenHarmony. Its ohos
# backend answers `Error::NotImplemented` to `address()` and `netmask()`, and
# shadowsocks-service's tun serving loop returns that error before it reads a
# single packet — so the tunnel came up, logged success, and forwarded nothing
# (no traffic, no flow-stat samples, a probe that never answered). The vendored
# copy reports the address and netmask the caller already placed in the
# Configuration. The diff against tun 0.7.22 is confined to
# src/platform/ohos/device.rs and is described in vendor/tun/PATCH.md.
[patch.crates-io]
tun = { path = "vendor/tun" }
